name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # only used to attach the APK to a Release when you push a v* tag

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21 (required by Capacitor 7)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        # With a package-lock.json in the repo the exact tested versions are installed (npm ci).
        # Without one, npm install resolves fresh versions and the lock it writes is saved as an artifact below,
        # so you can download it and commit it to make later builds repeatable.
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "No package-lock.json in the repository - resolving versions fresh."
            npm install --no-audit --no-fund
          fi

      - name: Save the generated lockfile
        if: hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: ignore

      - name: Syntax checks and tests
        run: |
          npm run check
          npm test

      - name: Build web bundle (www/)
        run: npm run build:www

      - name: Generate Android project
        run: npx cap add android

      - name: Apply version and icon
        run: |
          VERSION_NAME="$(node -p "require('./package.json').version")"
          bash scripts/android-customize.sh "$VERSION_NAME" "${{ github.run_number }}"

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Use the saved signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            printf '%s' "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Using the saved signing key, so this APK installs over older builds."
          else
            echo "::warning::No ANDROID_DEBUG_KEYSTORE_BASE64 secret found. This APK gets a new random signing key, so Android will refuse to install it over an older build. See docs/SIGNING.md."
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          VERSION_NAME="$(node -p "require('./package.json').version")"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/Tokyo-Manga-Lab-${VERSION_NAME}-debug.apk"
          ls -lh dist

      - name: Show the signing fingerprint
        run: |
          echo "If this SHA-256 is the same as the previous build, the APK installs as an update."
          keytool -printcert -jarfile dist/*.apk | grep -E "SHA256|Owner" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tokyo-Manga-Lab-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.apk \
            --title "Tokyo Manga Lab ${GITHUB_REF_NAME}" \
            --notes "Debug-signed APK. Enable 'Install unknown apps' on Android to install." \
            --prerelease
