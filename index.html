<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09080f">
  <meta name="description" content="Tokyo Manga Lab — your manga library, your rules.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/screens.css">
  <link rel="stylesheet" href="./css/reader.css">
  <title>Tokyo Manga Lab</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="Tokyo Manga Lab home">
        <span class="brand-mark" aria-hidden="true">東</span>
        <span class="brand-copy"><strong>Tokyo Manga Lab</strong><small>Your manga. Your world.</small></span>
      </a>
      <div class="topbar-actions">
        <span class="connection-pill" id="connectionStatus"><span class="status-dot"></span> Connecting</span>
        <button class="icon-button" type="button" data-action="toggle-theme" aria-label="Change theme" title="Change theme">◐</button>
      </div>
    </header>

    <nav class="desktop-nav" aria-label="Main navigation">
      <a href="#home" data-nav="home"><span>⌂</span> Home</a>
      <a href="#discover" data-nav="discover"><span>⌕</span> Discover</a>
      <a href="#library" data-nav="library"><span>▤</span> Library</a>
      <a href="#downloads" data-nav="downloads"><span>⇩</span> Downloads</a>
      <a href="#profile" data-nav="profile"><span>◉</span> Profile</a>
      <a href="#settings" data-nav="settings"><span>⚙</span> Settings</a>
    </nav>

    <main id="appView" class="app-view" tabindex="-1">
      <div class="initial-loading"><span class="spinner"></span><p>Preparing your library…</p></div>
    </main>

    <nav class="mobile-nav" aria-label="Main navigation">
      <a href="#home" data-nav="home"><span>⌂</span><small>Home</small></a>
      <a href="#discover" data-nav="discover"><span>⌕</span><small>Discover</small></a>
      <a href="#library" data-nav="library"><span>▤</span><small>Library</small></a>
      <a href="#downloads" data-nav="downloads"><span>⇩</span><small>Downloads</small></a>
      <a href="#profile" data-nav="profile"><span>◉</span><small>Profile</small></a>
    </nav>
  </div>

  <dialog id="detailsDialog" class="details-dialog" aria-labelledby="detailsTitle">
    <button class="dialog-close" type="button" data-action="close-details" aria-label="Close details">×</button>
    <div id="detailsContent"></div>
  </dialog>
  <input id="backupFileInput" type="file" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
